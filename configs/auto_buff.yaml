# Stage 0 runtime parameters for BuffProcessor.
tracking_timeout_ms: 20

# Stage 1 observation validation, ROI, contour extraction and quality thresholds.
observation_refiner:
  roi_margin_ratio: 0.20
  roi_margin_px: 12
  min_point_distance_px: 4.0
  min_armor_area_px2: 100.0
  min_armor_edge_px: 4.0
  r_boundary_tolerance_px: 2.0
  gaussian_kernel_size: 5
  binary_threshold: 40
  morphology_kernel_size: 3
  min_contour_area_px2: 12.0
  armor_area_relative_error: 0.80
  light_arm_line_samples: 80
  good_confidence: 0.70
  good_geometry_score: 0.50
  good_contour_support: 0.45
