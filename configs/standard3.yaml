enemy_color: "red"
# enemy_color: "blue"

#####-----神经网络参数-----#####
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
device: GPU
min_confidence: 0.8
use_traditional: true


#####-----web_debug_display-----#####
debug_display:
  window:
    enabled: true
    auto_detect: true
  web:
    enabled: false
    port: 8080

#####-----debug_bus-----#####
debug_bus:
  sinks:
    web:
      enabled: false
      port: 8080
      bind: "0.0.0.0"


#####-----ROI-----#####
roi: 
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75

#####-----aimer参数-----#####
yaw_offset: 2 # degree -2.5
pitch_offset: 6.5 # degree 2
comming_angle: 55 # degree
leaving_angle: 20 # degree
decision_speed: 7 # rad/s
high_speed_delay_time: 0.0 # s
low_speed_delay_time: 0.0 # s planner use this value

#####-----shooter参数-----#####
first_tolerance: 3 # 近距离射击容差，degree
second_tolerance: 2 # 远距离射击容差，degree
judge_distance: 2 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击

camera_name: "hikrobot"
exposure_ms: 2.5
gain: 16.9
vid_pid: "2bdf:0001"

# camera_name: "mindvision"
# exposure_ms: 2.0
# gamma: 0.5
# vid_pid: "f622:d132"

#  1  0  0
#  0  1  0
#  0  0  1
R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]

# 重投影误差: 0.1820px
camera_matrix: [1803.85723,    0.     ,  698.29467,
            0.     , 1800.27952,  579.92966,
            0.     ,    0.     ,    1.     ]
distort_coeffs: [-0.086982, 0.202748, -0.000254, 0.000123, 0.000000]

# 相机同理想情况的偏角: yaw1.44 pitch-7.28 roll0.96 degree
# 标定板到世界坐标系原点的水平距离: 1.13 m
# 标定板同竖直摆放时的偏角: yaw7.61 pitch13.92 roll-0.46 degree
R_camera2gimbal: [1, 0, 0, 0, 1, 0, 0, 0, 1]
t_camera2gimbal: [0.0, -0.045, 0.045]

#####-----cboard参数-----#####
quaternion_canid: 0x100
bullet_speed_canid: 0x101
send_canid: 0xff
can_interface: "can0"

#####-----gimbal参数-----#####
com_port: "/dev/gimbal"

yaw_kp: 0
yaw_kd: 0
pitch_kp: 0
pitch_kd: 0

#####-----planner-----#####
fire_thresh: 0.0035

max_yaw_acc: 50
Q_yaw: [9e6, 0]
R_yaw: [1]

max_pitch_acc: 100
Q_pitch: [9e6, 0]
R_pitch: [1]

#####-----buff_detector参数-----#####
model: "assets/yolo11_buff_int8.xml"

#####-----buff_aimer参数-----#####
fire_gap_time: 0.700   # s
predict_time: 0.120     # s

#####-----滤波器参数集（基于角速度自动切换）-----#####
# 角速度阈值从小到大排列，当前 |w| < threshold 时使用该参数集
# v1: 位置过程噪声（越大跟踪越快但越抖）
# v2: 角度过程噪声（越大角度响应越快）
# R_yaw/R_pitch/R_distance: 观测噪声（越小越信任观测值）
filter_param_sets:
  - name: "slow"
    v1: 10.0
    v2: 0.5
    R_yaw: 0.004
    R_pitch: 0.004
    R_distance: 0.09
    angular_velocity_threshold: 2.0   # |w| < 2 rad/s 时使用此参数集（慢速/旋转目标）
  - name: "normal"
    v1: 100.0
    v2: 400.0
    R_yaw: 0.004
    R_pitch: 0.004
    R_distance: 0.09
    angular_velocity_threshold: 8.0   # 2 <= |w| < 8 时使用（常规目标）
  - name: "fast"
    v1: 500.0
    v2: 1000.0
    R_yaw: 0.002
    R_pitch: 0.002
    R_distance: 0.05
    angular_velocity_threshold: 999.0 # |w| >= 8 时使用（快速平移目标）